<div class="page-heading">
	<div>
		<h1 class="text-3xl font-bold">Food Catalogue</h1>
		<p class="text-base-content/70">Search, filter, sort, and manage food records.</p>
	</div>
	<a routerLink="/foods/new" class="btn btn-primary">Add Food</a>
</div>

<div class="filter-panel">
	<input
		type="text"
		placeholder="Search food name"
		[(ngModel)]="searchText"
		class="input input-bordered w-full"
	/>

	<input
		type="text"
		placeholder="Category"
		[(ngModel)]="category"
		class="input input-bordered w-full"
	/>

	<input
		type="number"
		placeholder="Max calories"
		[(ngModel)]="maxCalories"
		class="input input-bordered w-full"
	/>

	<select [(ngModel)]="sortBy" class="select select-bordered w-full">
		<option value="name">Name</option>
		<option value="category">Category</option>
		<option value="calories">Calories</option>
		<option value="price">Price</option>
	</select>

	<select [(ngModel)]="direction" class="select select-bordered w-full">
		<option value="asc">Ascending</option>
		<option value="desc">Descending</option>
	</select>

	<button type="button" class="btn btn-neutral" (click)="applyQuery()">Apply</button>
</div>

@if (loading()) {
	<p>Loading foods...</p>
} @else if (error()) {
	<p class="error">{{ error() }}</p>
} @else {
	<p class="my-4 font-medium">Total Foods: {{ foods().length }}</p>

	<div class="food-grid">
		@for (food of foods(); track food.id) {
			<app-food-card
				[food]="food"
				(deleteFood)="deleteFood($event)"
			/>
		}
	</div>
}
