<nav class="navbar bg-base-100 border-b border-base-300 px-6">
  <div class="navbar-start">
    <a routerLink="/dashboard" class="btn btn-ghost text-xl">Meal Catalogue</a>
  </div>

  <div class="navbar-end">
    <div class="nav-links">
      @if (authService.currentUser()) {
        <a routerLink="/dashboard" class="btn btn-ghost">Dashboard</a>

        @if (!isDashboardPage) {
          @if (isFoodPage) {
            <a routerLink="/meal-plans" class="btn btn-ghost">Meal Plans</a>
          }

          @if (isMealPlanPage) {
            <a routerLink="/foods" class="btn btn-ghost">Food Catalogue</a>
          }
        }

        <span class="user-label">{{ authService.currentUser()!.username }}</span>
        <button type="button" class="btn btn-outline" (click)="logout()">Logout</button>
      } @else {
        <a routerLink="/login" class="btn btn-ghost">Login</a>
        <a routerLink="/register" class="btn btn-primary">Register</a>
      }
    </div>
  </div>
</nav>

<main class="app-page">
  <router-outlet />
</main>
